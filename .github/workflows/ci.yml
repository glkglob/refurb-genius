name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Server Sentry safety tests
        run: |
          pnpm exec vitest run \
            src/platform/sentry/server-isolation.test.ts \
            src/platform/sentry/server-capture.test.ts \
            src/platform/sentry/sanitize-server.test.ts \
            src/platform/sentry/server.init.test.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:vercel

  invariant-tests:
    name: invariant-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:invariants
